<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A community-maintained calendar of AI events in Stockholm.">
  <title>AI events in Stockholm</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AI STHLM">
  <meta property="og:title" content="AI STHLM Events">
  <meta property="og:description" content="A community-maintained calendar of AI events in Stockholm.">
  <meta property="og:url" content="https://ai-sthlm.github.io/events/">
  <meta property="og:image" content="https://ai-sthlm.github.io/assets/ai-sthlm.jpg">
  <meta property="og:image:alt" content="A stylized Stockholm skyline made of glowing AI network nodes.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AI STHLM Events">
  <meta name="twitter:description" content="A community-maintained calendar of AI events in Stockholm.">
  <meta name="twitter:image" content="https://ai-sthlm.github.io/assets/ai-sthlm.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <nav class="masthead" aria-label="Main navigation"><span class="brand"><a href="../">AI Sthlm</a></span><a class="add-event" href="https://github.com/ai-sthlm/events/blob/HEAD/events/README.md">Add event ↗</a></nav>
    <header class="hero">
      <h1><span>Events</span></h1>
    </header>
    <main>
      <h2 class="section-label">Upcoming</h2>
      $EVENTS
    </main>
    <footer></footer>
  </div>
  <script src="https://ai-sthlm.github.io/assets/marked.min.js"></script>
  <script>
    (() => {
      const escapeHtml = (text) => text.replace(/[&<>"']/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
      const renderer = new marked.Renderer();
      // Event bodies are Markdown, not arbitrary HTML.
      renderer.html = (token) => escapeHtml(token.raw);
      renderer.link = function (token) {
        try {
          const protocol = new URL(token.href, document.baseURI).protocol;
          if (!['http:', 'https:', 'mailto:'].includes(protocol)) return this.parser.parseInline(token.tokens);
        } catch (_) {
          return this.parser.parseInline(token.tokens);
        }
        const title = token.title ? ' title="' + escapeHtml(token.title) + '"' : '';
        return '<a href="' + escapeHtml(token.href) + '"' + title + ' rel="noopener noreferrer">' + this.parser.parseInline(token.tokens) + '</a>';
      };
      document.querySelectorAll('.markdown-source').forEach((element) => {
        element.classList.remove('markdown-source');
        element.innerHTML = marked.parse(element.textContent, { renderer, mangle: false, headerIds: false });
      });
    })();
  </script>
</body>
</html>
