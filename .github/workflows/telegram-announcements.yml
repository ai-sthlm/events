name: Announce new events on Telegram

on:
  push:
    branches: [main]
    paths:
      - "events/**"

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A push can contain multiple commits, so github.event.before may be
          # older than the immediate parent of the checked-out SHA.
          fetch-depth: 0

      - name: Post newly added events
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 scripts/announce_telegram_events.py "$BEFORE" "$AFTER"
